version: '3.8'

services:
  web:
    image: nginx:stable-alpine # Легковесный образ Nginx
    container_name: my_editable_site
    ports:
      - "8080:80" # Пробрасываем порт 80 из контейнера на порт 8080 твоего компьютера
    volumes:
      - ./html:/usr/share/nginx/html:ro # Монтируем папку ./html в контейнер
      - ./nginx.conf:/etc/nginx/nginx.conf:ro # Монтируем наш конфиг (см. ниже)
